spring:
  application:
    name: roomi
  datasource:
    url: jdbc:h2:mem:roomi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    secret: test-secret-for-integration-tests-32-bytes-long
    ttl: 15m
  mail:
    enabled: false
    from: test@roomi.kz
    confirm-url: http://localhost:5173/confirm
  cors:
    origins: http://localhost:5173
